# CI for the portfolio (TASK-20261112-10).
# Stage 1 (fast-gate): cheap static checks + unit tests, one matrix job per check, fail-fast.
# Stage 2 (needs stage 1): build once -> dist artifact, then e2e (explicit groups), Lighthouse CI
# (mobile + desktop, 3 runs, build-plan §3 budgets) on that dist; budget:check (PF-06) in parallel with its own build.
# Rollback: revert the PR that added this file (or delete .github/workflows/ci.yml).
name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: "0" # never install git hooks on the runner
  ASTRO_TELEMETRY_DISABLED: "1"
  # Must match bun.lock @playwright/test and the e2e-xb / load-stability container tag
  # (mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble). The install action fails if they drift.
  PLAYWRIGHT_VERSION: "1.65.0"

jobs:
  # ---------------------------------------------------------------- stage 1
  fast-gate:
    name: fast-gate (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        check: [check, typecheck, "lint:oxlint", "lint:fsd", "format:check", test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PF-05 (#8): the e2e spec-inventory guard (tests/unit/e2e-projects.test.ts) needs
          # origin/main to find the merge-base; a shallow clone makes it fail on purpose.
          fetch-depth: ${{ matrix.check == 'test' && '0' || '1' }}
      - uses: ./.github/actions/setup
      - run: bun run ${{ matrix.check }}

  # ---------------------------------------------------------------- stage 2
  build:
    needs: fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      # Built-HTML contract for PF-13: no form[action^=mailto] (unit tests stay hermetic).
      - run: bun tools/no-mailto-action.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        # Explicit groups instead of --shard: every job stays well under 20 min (the 300 s sweeps
        # get their own jobs) and the render-loop test runs alone in a fresh browser, so a previous
        # full-tier test's SwiftShader backlog cannot eat its 60 s budget (TASK-20261112-10 INV-1).
        # TASK-18: m2-qa-b split into sweep-1600 (B-7 1600×1000 scroll sweeps) + the rest.
        # app-features: e2e specs that landed on main after #4 branched and were otherwise ungrouped.
        include:
          - group: render-loop
            args: tests/e2e/tiers.spec.ts --grep "render loop is on demand"
          - group: tiers
            args: tests/e2e/tiers.spec.ts --grep-invert "render loop is on demand|M1-AC16 there is no Motion toggle"
          # PF-70: chromium visible-jump is quarantined (tools/ci/quarantine.json).
          # It runs in `quarantine (e2e)` so a stall-cap flake cannot fail-fast-cancel
          # the other e2e groups or turn ci-ok red. Assertions and the cap are unchanged.
          - group: static-structure-content
            args: tests/e2e/static.spec.ts tests/e2e/structure.spec.ts tests/e2e/owner-content.spec.ts
          - group: m2
            args: tests/e2e/m2.spec.ts tests/e2e/m2-keys.spec.ts
          - group: m2-qa-b
            args: tests/e2e/m2-qa-b.spec.ts --grep-invert "scroll sweep at 1600|B-4 the render loop idles"
          - group: sweep-1600
            args: tests/e2e/m2-qa-b.spec.ts --grep "scroll sweep at 1600"
          - group: app-features
            args: tests/e2e/contact-form.spec.ts tests/e2e/mobile-menu.spec.ts tests/e2e/seo.spec.ts tests/e2e/serif-once.spec.ts tests/e2e/static-stills.spec.ts tests/e2e/ui-preview.spec.ts tests/e2e/progress-top.spec.ts tests/e2e/loader.spec.ts
          - group: probe-cost
            args: tests/e2e/probe-cost.spec.ts tests/e2e/probe-cost-webgl-disabled.spec.ts
          # PF-03: axe-core scan across tiers and states (report in test-results/a11y, uploaded below).
          - group: a11y
            args: tests/e2e/a11y.spec.ts
          # PF-05 (#8): the engine-neutral stand-ins on Chromium. Firefox and WebKit: job e2e-xb.
          - group: cross-browser
            args: tests/e2e/cross-browser.spec.ts
          # PF-59: first-screen font/background stability (Hello-parse, tone, full-tier still).
          - group: load-stability
            args: tests/e2e/load-stability.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Same engine the box/QA verifies with: the runner image's preinstalled Google Chrome
      # (playwright.config.ts honours CHROME_PATH). Chromium only; no browser download to cache.
      - run: /usr/bin/google-chrome --version
      # PF-05 (#8) adds firefox and webkit projects; these groups stay Chromium (QA L2 on #4).
      - run: bunx playwright test ${{ matrix.args }} --project=chromium --reporter=list,html
        env:
          E2E_PREBUILT: "1" # serve the shared dist; do not rebuild
          CHROME_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # PF-05 (#8): Firefox and WebKit run the static-tier and cross-browser specs only (PM scope,
  # attempt 5). Full-tier tests (WebGL scene: B-7 sweeps, contact-form full tier, the hardware-GPU
  # tier check, a11y full tier, M1-AC15 at D, TASK-14 full tier) stay Chromium-gated here and run
  # locally on FF/WK; they are listed under PF-45 in the PR. Sharded, no fail-fast, no merge-reports.
  #
  # CI-5: these jobs (and e2e-load-stability-webkit) used to run
  # `bunx playwright install --with-deps <browser>` on ubuntu-24.04, and apt often took 17–20 min
  # so the 20 min job timeout cancelled the tests (run 44258815586). System libraries now come
  # from the official Playwright image (already has the deps). Browser binaries are cached at
  # ~/.cache/ms-playwright, key ${{ runner.os }}-playwright-<lockfile version>-<browser>
  # (see .github/actions/playwright-browser and docs/ci.md). Install has a 5 min step timeout so
  # it cannot eat the test budget. Job timeout stays 20 min. The shared `dist` artifact is reused;
  # no per-shard rebuild. Do not add --with-deps back.
  e2e-xb:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      # GHA sets HOME=/github/home (owned by pwuser) while the job runs as root.
      # Firefox refuses to launch in that case; Playwright documents HOME=/root.
      HOME: /root
      # ui-preview.spec builds into os.tmpdir(); /tmp is a different device than
      # the bind-mounted workspace, and Astro rename() then fails with EXDEV.
      TMPDIR: ${{ github.workspace }}/.tmp
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workspace temp dir
        run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/playwright-browser
        timeout-minutes: 5
        with:
          browser: ${{ matrix.browser }}
      # No CHROME_PATH: specs with their own launchOptions would start Chrome with it.
      # PF-70: WebKit phone LCP is quarantined; Firefox still runs it in this job.
      # PF-67: loader.spec.ts runs in this blocking job (and in Chromium app-features).
      - name: Playwright Firefox / WebKit tests
        shell: bash
        run: |
          set -euo pipefail
          invert='full tier|desktop, hardware GPU|M1-AC15 CLS .* at D$'
          if [ "${{ matrix.browser }}" = webkit ]; then
            invert="$invert|phone: the first still is the eager, high-priority, first-fetched LCP candidate"
          fi
          bunx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 \
            tests/e2e/static.spec.ts tests/e2e/structure.spec.ts tests/e2e/owner-content.spec.ts \
            tests/e2e/static-stills.spec.ts tests/e2e/contact-form.spec.ts tests/e2e/mobile-menu.spec.ts \
            tests/e2e/seo.spec.ts tests/e2e/serif-once.spec.ts tests/e2e/ui-preview.spec.ts \
            tests/e2e/cross-browser.spec.ts tests/e2e/a11y.spec.ts tests/e2e/loader.spec.ts \
            --grep-invert "$invert" \
            --reporter=list,html
        env:
          E2E_PREBUILT: "1" # serve the shared dist; do not rebuild
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # PF-59: load-stability on WebKit with a bare fontconfig (Liberation only), so the old
  # fallback bug (664115d) is visible. Soft system/Google fonts on the runner would hide it.
  # Chromium of the same spec is the load-stability group in `e2e` above. Not folded into
  # e2e-xb: those jobs must keep the default fontconfig. CI-5: same browser cache + official
  # image as e2e-xb (no --with-deps). FONTCONFIG_FILE still restricts visible fonts to Liberation.
  e2e-load-stability-webkit:
    name: e2e (webkit load-stability)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workspace temp dir
        run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/playwright-browser
        timeout-minutes: 5
        with:
          browser: webkit
      - name: Check Liberation fonts for FONTCONFIG_FILE
        shell: bash
        run: |
          set -euo pipefail
          dir=/usr/share/fonts/truetype/liberation
          if [ -d "$dir" ] && ls "$dir"/*.ttf >/dev/null 2>&1; then
            echo "Liberation fonts present in $dir"
            ls "$dir"
            exit 0
          fi
          echo "::error::$dir is missing; this job's fontconfig only reads that path."
          ls -la /usr/share/fonts/truetype || true
          exit 1
      - run: bunx playwright test tests/e2e/load-stability.spec.ts --project=webkit --reporter=list,html
        env:
          E2E_PREBUILT: "1" # serve the shared dist; do not rebuild
          PLAYWRIGHT_HTML_OPEN: never
          FONTCONFIG_FILE: ${{ github.workspace }}/tools/ci/fontconfig-nosoft/fonts.conf
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit-load-stability
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse (${{ matrix.form }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx --yes @lhci/cli@0.16.1 autorun --config=tools/ci/lighthouserc.${{ matrix.form }}.json
      # PF-70: stash collect output so quarantine (lh mobile TBT) can re-assert without a second collect.
      - if: ${{ !cancelled() && matrix.form == 'mobile' }}
        run: |
          mkdir -p lhci-report/mobile-raw
          cp -a .lighthouseci/. lhci-report/mobile-raw/ || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.form }}
          path: lhci-report
          retention-days: 14
          if-no-files-found: ignore

  # PF-06's budget:check (PR #5) replaces the old tools/ci/bundle-budget.mjs. It makes its own
  # build (hidden source maps, needed to split three.js vs scene code) and measures transfer in
  # Chrome, so it does not use the shared dist and runs alongside `build`.
  bundle-size:
    name: budget-check
    needs: fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run budget:check -- --json budget.json
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget
          path: budget.json
          retention-days: 14
          if-no-files-found: ignore

  # PF-70: quarantined tests (tools/ci/quarantine.json) still run on every PR.
  # These jobs show on the PR but are intentionally NOT in ci-ok needs, so a
  # failure here does not turn the blocking gate red. Removing an entry from
  # the list and from the excludes above puts it back in the blocking jobs.
  # Branch protection / required checks are not modified (Owner deferred).
  quarantine-e2e:
    name: quarantine (e2e)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: /usr/bin/google-chrome --version
      - name: Run quarantined Chromium e2e
        run: >-
          bunx playwright test
          tests/e2e/tiers.spec.ts
          tests/e2e/m2-qa-b.spec.ts
          tests/e2e/visible-jump.spec.ts
          --grep "M1-AC16 there is no Motion toggle|B-4 the render loop idles|PF-50 reload at"
          --project=chromium --reporter=list,html
        env:
          E2E_PREBUILT: "1"
          CHROME_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-quarantine-e2e
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  quarantine-webkit-lcp:
    name: quarantine (webkit phone LCP)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workspace temp dir
        run: mkdir -p "$TMPDIR"
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/playwright-browser
        timeout-minutes: 5
        with:
          browser: webkit
      - name: Run quarantined WebKit phone LCP
        run: >-
          bunx playwright test tests/e2e/static-stills.spec.ts
          --project=webkit
          --grep "phone: the first still is the eager, high-priority, first-fetched LCP candidate"
          --reporter=list,html
        env:
          E2E_PREBUILT: "1"
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-quarantine-webkit-lcp
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  quarantine-lh-tbt:
    name: quarantine (lh mobile TBT)
    # Run whenever the mobile LH artifact might exist, even if a sibling LH job failed.
    if: ${{ always() && needs.build.result == 'success' }}
    needs: [build, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-mobile
          path: lhci-report
      - name: Assert quarantined mobile TBT and performance budgets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lighthouseci
          if [ -d lhci-report/mobile-raw ]; then
            cp -a lhci-report/mobile-raw/. .lighthouseci/
          elif [ -d lhci-report/mobile ]; then
            i=0
            for f in lhci-report/mobile/*.report.json; do
              [ -f "$f" ] || continue
              i=$((i + 1))
              cp "$f" ".lighthouseci/lhr-${i}.json"
            done
          fi
          if ! ls .lighthouseci/*.json >/dev/null 2>&1; then
            echo "::error::No Lighthouse results found to assert TBT against."
            find lhci-report -type f | head
            exit 1
          fi
          npx --yes @lhci/cli@0.16.1 assert --config=tools/ci/lighthouserc.mobile-tbt.json

  # Blocking gate: green only if every non-quarantine job above passed.
  # Quarantine jobs are omitted on purpose. Do not add them here.
  # There are no GitHub required checks (Owner deferred); ci-ok is the intended gate.
  ci-ok:
    if: ${{ always() }}
    needs: [fast-gate, build, e2e, e2e-xb, e2e-load-stability-webkit, lighthouse, bundle-size]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more CI jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "All CI jobs passed."
