# CI for the portfolio (TASK-20261112-10).
# Stage 1 (fast-gate): cheap static checks + unit tests, one matrix job per check, fail-fast.
# Stage 2 (needs stage 1): build once -> dist artifact, then e2e (sharded), Lighthouse CI
# (mobile + desktop, 3 runs, build-plan §3 budgets) and the bundle-size budget, all on that dist.
# Rollback: revert the PR that added this file (or delete .github/workflows/ci.yml).
name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEFTHOOK: "0" # never install git hooks on the runner
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------- stage 1
  fast-gate:
    name: fast-gate (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        check: [check, typecheck, "lint:oxlint", "lint:fsd", "format:check", test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run ${{ matrix.check }}

  # ---------------------------------------------------------------- stage 2
  build:
    needs: fast-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e (shard ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bunx playwright test --shard=${{ matrix.shard }}/2 --reporter=list,html
        env:
          E2E_PREBUILT: "1" # serve the shared dist; do not rebuild
          PLAYWRIGHT_HTML_OPEN: never
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse (${{ matrix.form }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx --yes @lhci/cli@0.16.1 autorun --config=tools/ci/lighthouserc.${{ matrix.form }}.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.form }}
          path: lhci-report
          retention-days: 14
          if-no-files-found: ignore

  bundle-size:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: node tools/ci/bundle-budget.mjs dist

  # One stable check for branch protection: green only if every job above passed.
  ci-ok:
    if: ${{ always() }}
    needs: [fast-gate, build, e2e, lighthouse, bundle-size]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more CI jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "All CI jobs passed."
