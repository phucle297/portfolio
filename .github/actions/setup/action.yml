name: Setup toolchain
description: Node (from .nvmrc) + Bun (from package.json packageManager), cached Bun install, frozen lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    # oven-sh/setup-bun needs unzip, which the official Playwright image does not ship
    # (CI-5). On the ubuntu-24.04 runner unzip is present and this still uses setup-bun.
    - name: Detect unzip
      id: unzip
      shell: bash
      run: |
        if command -v unzip >/dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "unzip not on PATH; bun will be installed via npm"
        fi
    - if: ${{ steps.unzip.outputs.present == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - if: ${{ steps.unzip.outputs.present == 'false' }}
      name: Install bun via npm (no unzip, no apt)
      shell: bash
      run: |
        set -euo pipefail
        ver="$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")"
        prefix="${HOME}/.local"
        mkdir -p "${prefix}"
        npm install -g "bun@${ver}" --prefix "${prefix}"
        echo "${prefix}/bin" >> "$GITHUB_PATH"
        "${prefix}/bin/bun" --version
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile
