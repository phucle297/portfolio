<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PF-59: bare fontconfig for the WebKit load-stability job. Only Liberation, so WebKit
  cannot hide the pre-664115d fallback bug behind soft system/Google families.
  Portable to ubuntu-24.04 (fonts-liberation). Local QA used /tmp/fc-nosoft with
  Liberation plus sandbox Arimo/Tinos; those sandbox paths do not exist on the runner.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir>/tmp/fc-nosoft-ci/cache</cachedir>
</fontconfig>
